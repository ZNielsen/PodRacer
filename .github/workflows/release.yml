name: Release

on:
  release:
    types: [published]

jobs:
  build-rpi:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            suffix: armv7
          - target: aarch64-unknown-linux-gnu
            suffix: aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Collect binaries
        run: |
          cp target/${{ matrix.target }}/release/podracer podracer-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/podarch  podarch-${{ matrix.suffix }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            podracer-${{ matrix.suffix }}
            podarch-${{ matrix.suffix }}

  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - run: |
          sudo mkdir -p /var/lib/docker
          sudo mount -t tmpfs -o size=10G none /var/lib/docker
          sudo systemctl restart docker

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/znielsen/podracer:latest
            ghcr.io/znielsen/podracer:${{ github.ref_name }}
